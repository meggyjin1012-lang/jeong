services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: omeka_s
      MARIADB_USER: omeka_s
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  omeka:
    image: libops/omeka-s:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_NAME: omeka_s
      DB_USER: omeka_s
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      OMEKA_S_ADMIN_EMAIL: ${OMEKA_S_ADMIN_EMAIL}
      OMEKA_S_ADMIN_PASSWORD: ${OMEKA_S_ADMIN_PASSWORD}
    volumes:
      - files:/var/www/omeka-s/files

volumes:
  db:
  files:
